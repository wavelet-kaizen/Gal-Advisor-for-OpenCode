name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ['2.0.0', '2.2.0', '2.3.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.plugin != '2.0.0'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @opencode/plugin@${{ matrix.plugin }}
      - run: npm test
      - run: npm run typecheck
